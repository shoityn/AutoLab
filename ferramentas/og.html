<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Fonte do og-image</title>
    <!--
      Página-fonte do public/og-image.png (prévia no WhatsApp / redes).
      Para regerar: `npm run dev`, abrir /AutoLab/ferramentas/og.html, tirar um
      print do retângulo #og (1200x630) e salvar em public/og-image.png.
    -->
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        background: #15181e;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        font-family: ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif;
      }
      #og {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #1e222a;
      }
      #og .cena {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 42%;
      }
      #og .veu {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(11, 17, 24, 0.94) 0%, rgba(11, 17, 24, 0.86) 46%, rgba(11, 17, 24, 0.25) 100%);
      }
      #og .conteudo {
        position: absolute;
        inset: 0;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
        max-width: 780px;
      }
      #og .logo {
        height: 76px;
        width: auto;
        align-self: flex-start;
      }
      #og h1 {
        font-size: 40px;
        line-height: 1.18;
        font-weight: 700;
        color: #f1ebdd;
        letter-spacing: -0.5px;
      }
      #og h1 b {
        color: #67e8f9;
      }
      #og p {
        font-size: 21px;
        color: #f1ebdd;
        opacity: 0.72;
      }
      #og .zinos {
        position: absolute;
        right: 70px;
        bottom: 0;
        height: 480px;
        filter: drop-shadow(0 20px 50px rgba(0, 0, 0, 0.55));
      }
      #og .faixa {
        position: absolute;
        inset: auto 0 0 0;
        height: 8px;
        background: linear-gradient(90deg, #b45309 0%, #67e8f9 100%);
      }
    </style>
  </head>
  <body>
    <div id="og">
      <img class="cena" src="/fachada/cena.webp" alt="" />
      <div class="veu"></div>
      <img class="zinos" src="/mascote/corpo-acenando.webp" alt="" />
      <div class="conteudo">
        <img class="logo" src="/marca/autolab-horizontal-mono-branco.svg" alt="AutoLab" />
        <h1>A fábrica que monta um <b>modelo de inteligência artificial</b> — sala por sala.</h1>
        <p>Estágio Supervisionado (PACEX VIII) · UNIPAR</p>
      </div>
      <div class="faixa"></div>
    </div>
  </body>
</html>
